const DATA=[{"id": 0, "set": 1, "topic": 0, "q": "เกลือทะเล (Sea salt) อาศัยพลังงานใดในการระเหยน้ำเป็นหลัก?", "options": ["แรงเหวี่ยงจากเครื่องปั่น", "กระแสไฟฟ้าที่ขั้วแอโนด", "แสงอาทิตย์และลม", "ความร้อนจากปฏิกิริยานิวเคลียร์"], "answer": 2, "explain": "แสงอาทิตย์ให้ความร้อน ส่วนลมช่วยพาไอน้ำออก ทำให้น้ำระเหยและความเข้มข้นของเกลือเพิ่มขึ้น ไม่ใช่กระบวนการ electrolysis.", "page": "2", "kind": "จำ"}, {"id": 1, "set": 1, "topic": 0, "q": "หลักการของ Solution mining คือข้อใด?", "options": ["ใช้ไฟฟ้าเปลี่ยนหินเป็นคลอรีนใต้ดิน", "ระเหยน้ำทะเลบนผิวดินเท่านั้น", "สูบเกลือแห้งผ่านท่อโดยไม่ใช้น้ำ", "ฉีดน้ำลงชั้นเกลือให้ละลาย แล้วสูบน้ำเกลือขึ้นมา"], "answer": 3, "explain": "น้ำละลายเกลือหินเป็น brine และเกิดโพรงใต้ดิน ความลึกขึ้นกับแหล่งแร่ ไม่ควรจำตัวเลขในภาพเป็นค่าบังคับทุกโรงงาน.", "page": "2", "kind": "เข้าใจ"}, {"id": 2, "set": 1, "topic": 0, "q": "ผลิตภัณฑ์โดยตรงของ chlor-alkali electrolysis จากสารละลาย NaCl คือข้อใด?", "options": ["NaOH, Cl₂ และ H₂", "Na₂CO₃, Cl₂ และ O₂", "NaOH, CO₂ และ O₂", "NaCl, CaCO₃ และ Mg(OH)₂"], "answer": 0, "explain": "สมการรวมคือ 2NaCl + 2H₂O → 2NaOH + H₂ + Cl₂ โซดาแอชเป็นสารเคมีที่เกี่ยวข้องกับอุตสาหกรรมเกลือ แต่ไม่ใช่ผลิตภัณฑ์โดยตรงของเซลล์นี้.", "page": "2 • แก้ความคลาดเคลื่อน", "kind": "เข้าใจ"}, {"id": 3, "set": 1, "topic": 0, "q": "คู่ปฏิกิริยาที่ขั้วไฟฟ้าใดถูกต้องสำหรับเซลล์ chlor-alkali แบบเมมเบรน?", "options": ["แอโนด: 2Cl⁻ → Cl₂ + 2e⁻; แคโทด: 2H₂O + 2e⁻ → H₂ + 2OH⁻", "ทั้งสองขั้วผลิต Na₂CO₃", "แอโนดผลิต H₂; แคโทดผลิต Cl₂", "แอโนด: Na⁺ → Na; แคโทด: Cl₂ → Cl⁻"], "answer": 0, "explain": "แอโนดเกิด oxidation ของคลอไรด์ ส่วนแคโทดเกิด reduction ของน้ำ อิเล็กตรอน 2 mol สัมพันธ์กับ Cl₂ 1 mol.", "page": "2–3", "kind": "จำ"}, {"id": 4, "set": 1, "topic": 0, "q": "ต้องการกำจัด Ca²⁺ และ Mg²⁺ จากน้ำเกลือ ควรจับคู่สารและตะกอนอย่างไร?", "options": ["H₂ ให้ CaCO₃; Cl₂ ให้ Mg(OH)₂", "Na₂CO₃ ให้ CaCO₃; NaOH ให้ Mg(OH)₂", "NaOH ให้ CaCl₂; Na₂CO₃ ให้ MgCl₂", "NaCl ให้ CaCl₂; น้ำให้ MgSO₄"], "answer": 1, "explain": "Ca²⁺ + CO₃²⁻ → CaCO₃↓ และ Mg²⁺ + 2OH⁻ → Mg(OH)₂↓ การเปลี่ยนไอออนที่ละลายอยู่ให้เป็นตะกอนทำให้แยกออกได้.", "page": "2", "kind": "จำ"}, {"id": 5, "set": 1, "topic": 0, "q": "ลำดับหลักของ Brine purification ในสรุปคือข้อใด?", "options": ["แยกด้วยไฟฟ้า → เติมน้ำ → สับ", "อบแห้ง → ปั่นเหวี่ยง → ฉีดน้ำใต้ดิน", "เติมสารเคมี → ทำปฏิกิริยา → ตกตะกอนและแยก", "ตกตะกอน → อบแห้ง → เติมสารเคมี"], "answer": 2, "explain": "ต้องให้สารเคมีทำปฏิกิริยากับสิ่งเจือปนก่อน จึงแยกตะกอนและส่งน้ำเกลือที่ผ่านการทำให้บริสุทธิ์ไปขั้นถัดไปได้.", "page": "2", "kind": "จำ"}, {"id": 6, "set": 1, "topic": 0, "q": "เหตุใดจึงใช้การระเหยภายใต้สุญญากาศ?", "options": ["ลดความดันทำให้จุดเดือดของสารละลายลดลง", "ทำให้ NaCl กลายเป็นไอทั้งหมด", "กำจัด Ca²⁺ โดยไม่ต้องแยกของแข็ง", "ทำให้จุดเดือดเพิ่มขึ้นเสมอ"], "answer": 0, "explain": "เมื่อความดันลดลง ของเหลวเดือดได้ที่อุณหภูมิต่ำลง แต่ยังต้องให้พลังงานเพื่อระเหยน้ำ สุญญากาศไม่ได้ทำให้ไม่ต้องใช้ความร้อน.", "page": "3", "kind": "เข้าใจ"}, {"id": 7, "set": 1, "topic": 0, "q": "การระเหยหลายเอฟเฟกต์ช่วยประหยัดไอน้ำด้วยหลักใด?", "options": ["ใช้ไอจากเอฟเฟกต์ก่อนหน้าเป็นแหล่งความร้อนให้เอฟเฟกต์ถัดไป", "เปลี่ยนผลึกเกลือเป็นเชื้อเพลิง", "ปล่อยไอทุกเอฟเฟกต์ทิ้งทันที", "ใช้แรงเหวี่ยงผลิตไอน้ำใหม่"], "answer": 0, "explain": "นำความร้อนแฝงของไอกลับมาใช้ โดยจัดระดับความดันและอุณหภูมิให้มีแรงขับในการถ่ายเทความร้อนระหว่างเอฟเฟกต์.", "page": "3", "kind": "เข้าใจ"}, {"id": 8, "set": 1, "topic": 0, "q": "ข้อใดอธิบายหน้าที่ Centrifuge และ Dryer ได้ถูกต้อง?", "options": ["Centrifuge แยกน้ำแม่ผลึกด้วยแรงเหวี่ยง; Dryer ลดความชื้นที่เหลือด้วยความร้อน", "Centrifuge ละลายเกลือ; Dryer ตกตะกอนแคลเซียม", "ทั้งคู่ทำ electrolysis", "Dryer ใช้เฉพาะการกรองโดยไม่มีความร้อน"], "answer": 0, "explain": "Slurry มีผลึกปนกับของเหลว เครื่องปั่นเหวี่ยงแยกของเหลวก่อน แล้วเครื่องอบลดความชื้นที่ยังเหลืออยู่ตามสเปกผลิตภัณฑ์.", "page": "3", "kind": "จำ"}, {"id": 9, "set": 1, "topic": 0, "q": "ผ่านกระแส 50,000 A นาน 1 ชั่วโมง ให้ F = 96,500 C/mol e⁻, Vₘ = 24 L/mol และประสิทธิภาพกระแส 100% จะได้ Cl₂ กี่ลิตรโดยประมาณ?", "options": ["22,383 L", "932.64 L", "1,800 L", "44,767 L"], "answer": 0, "explain": "Q = It = 50,000 × 3,600 = 180,000,000 C; n(Cl₂) = Q/(2F) = 932.64 mol; V = 932.64 × 24 = 22,383.42 L ต้องหาร 2 เพราะใช้ 2 mol e⁻ ต่อ Cl₂ 1 mol.", "page": "3", "kind": "คำนวณ"}, {"id": 10, "set": 1, "topic": 1, "q": "ขั้นตอนใหญ่ของอุตสาหกรรมเยื่อและกระดาษเรียงอย่างไร?", "options": ["Papermaking → Finishing → Pulping", "Pulping → Papermaking → Finishing", "Finishing → Pulping → Papermaking", "Drying → Debarking → Digester"], "answer": 1, "explain": "ผลิตและเตรียมเส้นใยก่อน นำเส้นใยมาขึ้นรูปแผ่น แล้วตกแต่งและแปรรูปเป็นผลิตภัณฑ์.", "page": "4", "kind": "จำ"}, {"id": 11, "set": 1, "topic": 1, "q": "เหตุใดจึงปอกเปลือกและคัดขนาดชิ้นไม้ก่อนทำเยื่อ?", "options": ["ทำให้ทุกชิ้นไม้ละลายในน้ำเย็นทันที", "เพิ่มเปลือกไม้ในเยื่อให้มากที่สุด", "ลดสิ่งที่ไม่เหมาะกับเนื้อกระดาษ และให้ชิ้นไม้มีขนาดสม่ำเสมอ", "เปลี่ยน cellulose เป็นเกลือ"], "answer": 2, "explain": "Debarking แยกเปลือกซึ่งอาจใช้เป็นเชื้อเพลิงชีวมวล ส่วน chipping และ screening ช่วยเตรียมชิ้นไม้ให้เหมาะและสม่ำเสมอต่อการทำเยื่อ.", "page": "4", "kind": "เข้าใจ"}, {"id": 12, "set": 1, "topic": 1, "q": "ความแตกต่างหลักของ Chemical กับ Mechanical pulping คืออะไร?", "options": ["ทางเคมีใช้เฉพาะจานบดโดยไม่มีสารเคมี", "ทางเคมีละลาย lignin; ทางกลใช้แรงแยกเส้นใยและคง lignin มากกว่า", "ทางกลไม่มีเส้นใย cellulose", "ทั้งสองวิธีกำจัด lignin หมดเท่ากัน"], "answer": 1, "explain": "Kraft ใช้สารเคมีสลายและละลาย lignin ขณะที่ refiner ใช้แรงทางกล จึงมีความต่างด้าน yield ความขาวและการเหลืองเมื่อเวลาผ่านไป.", "page": "4–5", "kind": "เข้าใจ"}, {"id": 13, "set": 1, "topic": 1, "q": "White liquor ของ Kraft process ในสรุปมีสารสำคัญใด?", "options": ["น้ำบริสุทธิ์และ O₂ เท่านั้น", "NaCl และ CaCO₃", "HCl และ HNO₃", "NaOH และ Na₂S"], "answer": 3, "explain": "White liquor คือน้ำยาต้มด่างที่มี NaOH และ Na₂S ส่วน black liquor เป็นน้ำยาหลังต้มที่มีสารอินทรีย์ละลายจากไม้และสารอนินทรีย์.", "page": "5", "kind": "จำ"}, {"id": 14, "set": 1, "topic": 1, "q": "Black liquor ต่างจาก White liquor อย่างไร?", "options": ["เป็นชื่อผลึก NaCl ในโรงงานเกลือ", "เป็นน้ำยาหลังต้มซึ่งมี lignin และสารจากไม้ละลายอยู่", "เป็นแผ่นกระดาษหลัง calender", "เป็นน้ำเย็นสะอาดก่อนเข้าหม้อต้ม"], "answer": 1, "explain": "การแยกเยื่อออกจากน้ำยาต้มทำให้ได้ black liquor สีเข้มจากสารอินทรีย์ที่ละลาย ไม่ใช่ชื่อของเยื่อสำเร็จรูป.", "page": "5", "kind": "จำ"}, {"id": 15, "set": 1, "topic": 1, "q": "Screening/Cleaning และ Thickening ทำหน้าที่ต่างกันอย่างไร?", "options": ["Thickening ลดความเข้มข้นด้วยการเติมน้ำเสมอ", "ทั้งคู่เพิ่ม lignin โดยตรง", "ขั้นแรกแยกสิ่งไม่ต้องการ; ขั้นหลังแยกน้ำเพื่อเพิ่มความเข้มข้นเยื่อ", "Screening คือการฟอกขาวด้วย O₂"], "answer": 2, "explain": "Screening/Cleaning มุ่งคุณภาพและความสะอาดของเยื่อ ส่วน thickener มุ่งเพิ่มสัดส่วนของแข็งใน slurry ด้วยการเอาน้ำออก.", "page": "5", "kind": "เข้าใจ"}, {"id": 16, "set": 1, "topic": 1, "q": "ข้อใดจับคู่การฟอกขาวได้เหมาะสมตามสรุป?", "options": ["การฟอกขาวมีหน้าที่เพิ่มขนาดชิ้นไม้", "Mechanical pulp ต้องกำจัด lignin หมดเพื่อคง yield สูง", "ทั้งสองแบบต้องทำลาย cellulose ให้มากที่สุด", "Chemical pulp เน้นกำจัด lignin; Mechanical pulp เน้นลดสีโดยคง lignin"], "answer": 3, "explain": "การฟอกแบบ lignin-preserving ช่วยรักษา yield ของเยื่อทางกล ส่วน oxygen delignification ใช้ O₂ และด่างลด lignin ก่อนการฟอกขั้นต่อไปในเส้นทางเยื่อเคมี.", "page": "5", "kind": "เข้าใจ"}, {"id": 17, "set": 1, "topic": 1, "q": "ลำดับและหน้าที่ในเครื่องทำกระดาษข้อใดถูกต้อง?", "options": ["Press ผลิตไอน้ำ → Wire ทำ NaOH → Dryer คัดไม้", "Headbox กระจายเยื่อ → Wire ขึ้นรูป/ระบายน้ำ → Press รีดน้ำ → Dryer ระเหยน้ำ", "Dryer ขึ้นรูป → Headbox ม้วน → Wire ฟอกขาว", "Headbox อบแห้ง → Press สับไม้ → Wire ต้มเยื่อ"], "answer": 1, "explain": "การรีดน้ำด้วยแรงกลก่อนเข้า dryer ลดภาระการระเหยซึ่งใช้พลังงานสูง ช่วยประหยัดพลังงานในการผลิตกระดาษ.", "page": "5–6", "kind": "จำ"}, {"id": 18, "set": 1, "topic": 1, "q": "Calender, Reel และ Winder ทำหน้าที่ใดตามลำดับ?", "options": ["ฟอกขาว → ต้มไม้ → กำจัดเปลือก", "เพิ่มความเข้มข้นเยื่อ → คัดชิ้นไม้ → เผาเปลือก", "ตกตะกอน → ปั่นเกลือ → อบเกลือ", "ปรับผิว/ความหนา → ม้วนใหญ่ → ตัดแบ่งและม้วนตามขนาด"], "answer": 3, "explain": "Calender ปรับความเรียบและผิว ส่วน Reel เก็บเป็นม้วนใหญ่ และ Winder/slitter แบ่งความกว้างและจัดม้วนตามต้องการ.", "page": "6", "kind": "จำ"}, {"id": 19, "set": 1, "topic": 1, "q": "กระดาษ A4 ขนาด 0.21 × 0.297 m, 70 g/m² จำนวน 2,500 แผ่น หนักเท่าไร โดยไม่รวมบรรจุภัณฑ์?", "options": ["10.91475 kg", "4.3659 kg", "109.1475 kg", "175 kg"], "answer": 0, "explain": "พื้นที่ต่อแผ่น = 0.06237 m²; มวลต่อแผ่น = 70 × 0.06237 = 4.3659 g; รวม = 4.3659 × 2,500 ÷ 1,000 = 10.91475 kg. GSM คือมวลต่อพื้นที่ ไม่ใช่ความหนาโดยตรง.", "page": "6", "kind": "คำนวณ"}, {"id": 20, "set": 1, "topic": 2, "q": "เป้าหมายหลักของ Energy management ในสรุปคือข้อใด?", "options": ["เพิ่มประสิทธิภาพ ลดการสูญเสีย ต้นทุน และการปล่อยก๊าซเรือนกระจก", "ลดการผลิตเป็นศูนย์เพื่อให้พลังงานเป็นศูนย์", "เพิ่มการใช้ไอน้ำทุกหน่วยผลิต", "เปลี่ยนมิเตอร์โดยไม่วิเคราะห์ข้อมูล"], "answer": 0, "explain": "ต้องดูประสิทธิภาพการใช้พลังงานควบคู่ผลผลิตและเงื่อนไขการเดินเครื่อง การใช้พลังงานรวมลดลงอย่างเดียวอาจเกิดจากผลิตน้อยลง.", "page": "7", "kind": "เข้าใจ"}, {"id": 21, "set": 1, "topic": 2, "q": "ข้อใดเป็น Process optimization?", "options": ["ปล่อยไอน้ำทิ้งเพื่อลดแรงดันโดยไม่วิเคราะห์", "หยุดบันทึกข้อมูลพลังงาน", "ปรับอุณหภูมิและเวลาให้อยู่ในช่วงที่ใช้พลังงานเหมาะสมและยังได้คุณภาพ", "ซื้อเครื่องจักรใหม่ทุกกรณี"], "answer": 2, "explain": "Optimization คือปรับการเดินกระบวนการให้เหมาะสม อาจลดพลังงานได้โดยยังไม่ต้องลงทุนเปลี่ยนอุปกรณ์หลัก.", "page": "7", "kind": "จำ"}, {"id": 22, "set": 1, "topic": 2, "q": "ตัวอย่างใดตรงกับ Heat integration?", "options": ["คัดชิ้นไม้ด้วยตะแกรง", "ใช้กระแสร้อนในกระบวนการอุ่นวัตถุดิบเย็น", "เพิ่มน้ำเย็นโดยไม่ดูภาระความร้อน", "ติดฉลากสารเคมี"], "answer": 1, "explain": "เป็นการจับคู่ความต้องการให้ความร้อนและการระบายความร้อนระหว่างกระแส เพื่อลดการใช้ utilities ภายนอก.", "page": "7", "kind": "เข้าใจ"}, {"id": 23, "set": 1, "topic": 2, "q": "ข้อใดเป็น Waste heat recovery?", "options": ["นำความร้อนจากไอเสียกลับไปอุ่นน้ำป้อน", "เปลี่ยนเกรดกระดาษโดยไม่วัดพลังงาน", "ติดตั้งถังเก็บสารตามลำดับตัวอักษร", "แยกตะกอน Mg(OH)₂"], "answer": 0, "explain": "ดักจับพลังงานที่กำลังจะสูญเสียออกจากระบบกลับมาใช้ ชื่อมาตรการอาจทับซ้อนกับ heat integration ได้เมื่อมีการแลกเปลี่ยนความร้อนระหว่างกระแส.", "page": "7", "kind": "จำ"}, {"id": 24, "set": 1, "topic": 2, "q": "Advanced monitoring และ Equipment upgrades ต่างกันอย่างไร?", "options": ["แบบแรกวัดและตรวจจับความผิดปกติ; แบบหลังปรับปรุงหรือเปลี่ยนอุปกรณ์", "แบบแรกเปลี่ยนมอเตอร์เสมอ; แบบหลังแค่อ่านมิเตอร์", "ทั้งสองไม่เกี่ยวกับประสิทธิภาพ", "ทั้งสองหมายถึงการฟอกขาว"], "answer": 0, "explain": "ข้อมูลแบบ real-time ช่วยพบความสูญเสีย ส่วนการเปลี่ยนอุปกรณ์ประสิทธิภาพสูงเป็นการแก้ที่ตัวอุปกรณ์ ทั้งสองสนับสนุนกันได้.", "page": "7", "kind": "เข้าใจ"}, {"id": 25, "set": 1, "topic": 2, "q": "ข้อใดเป็นชุด Utilities ที่พบในโรงงานตามสรุป?", "options": ["เฉพาะไฟฟ้าเท่านั้น", "ไฟฟ้า ไอน้ำ เชื้อเพลิง น้ำเย็น และระบบทำความเย็น", "เฉพาะกระดาษสำเร็จรูป", "เฉพาะวัตถุดิบไม้และ NaCl"], "answer": 1, "explain": "Utilities สนับสนุนการเดินกระบวนการทั้งไฟฟ้า ความร้อนและการระบายความร้อน จึงต้องวิเคราะห์มากกว่าค่าไฟเพียงอย่างเดียว.", "page": "7", "kind": "จำ"}, {"id": 26, "set": 1, "topic": 2, "q": "ISO 50001 เกี่ยวข้องกับเรื่องใดและใช้วงจรอะไร?", "options": ["ระบบผลิตคลอรีน และ Faraday", "ระบบจัดการพลังงาน และ PDCA", "ระบบคุณภาพกระดาษ และ GSM", "ระบบจัดเก็บสาร และ GHS เท่านั้น"], "answer": 1, "explain": "EnMS คือ Energy Management System ใช้ Plan–Do–Check–Act เพื่อปรับปรุงอย่างต่อเนื่อง ควิซนี้ทบทวนหลักการ ไม่ท่องข้อกำหนดรายข้อของมาตรฐาน.", "page": "7", "kind": "จำ"}, {"id": 27, "set": 1, "topic": 2, "q": "SEU, EnB และ EnPI จับคู่ถูกต้องในข้อใด?", "options": ["การใช้พลังงานที่มีนัยสำคัญ / ฐานอ้างอิงพลังงาน / ตัวชี้วัดสมรรถนะพลังงาน", "มิเตอร์ / หม้อไอน้ำ / น้ำหล่อเย็นเท่านั้น", "เป้าหมาย / ผลกำไร / ความหนากระดาษ", "สารเคมี / ของเสีย / มลพิษ"], "answer": 0, "explain": "SEU ช่วยเลือกจุดสำคัญ EnB เป็นฐานเปรียบเทียบ และ EnPI ใช้วัดสมรรถนะ เช่น kWh ต่อหน่วยผลิต โดยเลือกให้เหมาะกับลักษณะกระบวนการ.", "page": "7", "kind": "จำ"}, {"id": 28, "set": 1, "topic": 2, "q": "ใช้ไอน้ำ 10,000 kg/h ปีละ 8,000 ชั่วโมง ปริมาณไอน้ำทั้งปีเท่าไร?", "options": ["80,000,000 kg/year", "1,250 kg/year", "88,000,000 kg/year", "8,000,000 kg/year"], "answer": 0, "explain": "มวลต่อปี = อัตราการไหล × ชั่วโมงเดินเครื่อง = 10,000 × 8,000 = 80,000,000 kg/year หรือ 80,000 ton/year.", "page": "7", "kind": "คำนวณ"}, {"id": 29, "set": 1, "topic": 2, "q": "ไอน้ำ 80,000,000 kg/year ให้พลังงานใช้ประโยชน์ 2,443 kJ/kg ถ้าลดไอน้ำ 15% จะประหยัดความร้อนกี่ GJ/year?", "options": ["29,316 GJ/year", "293.16 GJ/year", "12,000 GJ/year", "195,440 GJ/year"], "answer": 0, "explain": "มวลที่ลด = 12,000,000 kg/year; ความร้อนที่ประหยัด = 12,000,000 × 2,443 = 29,316,000,000 kJ/year ÷ 10⁶ = 29,316 GJ/year. เป็นพลังงานจากไอน้ำ ไม่ใช่เชื้อเพลิงป้อนหม้อไอน้ำโดยตรง.", "page": "7", "kind": "คำนวณ"}, {"id": 30, "set": 1, "topic": 3, "q": "เป้าหมายของ Environmental management ตามสรุปมีอะไรบ้าง?", "options": ["ลดต้นทุนโดยไม่ต้องพิจารณามลพิษ", "ลดผลกระทบ ปฏิบัติตามกฎหมาย และพัฒนาอย่างยั่งยืน", "วัดเฉพาะค่าไฟและไม่ต้องดูน้ำเสีย", "เพิ่มปริมาณของเสียทุกชนิด"], "answer": 1, "explain": "การจัดการสิ่งแวดล้อมต้องมองหลายมิติทั้งผลกระทบ การปฏิบัติตามพันธกรณี และการปรับปรุงการดำเนินงาน.", "page": "8", "kind": "จำ"}, {"id": 31, "set": 1, "topic": 3, "q": "ISO 14001 และ ISO 50001 แตกต่างกันอย่างไร?", "options": ["14001 วัดเฉพาะความหนากระดาษ", "50001 เป็นมาตรฐานสัญลักษณ์สารเคมี", "ทั้งสองเป็นสูตรคำนวณไอน้ำ", "14001 เป็น EMS ครอบคลุมสิ่งแวดล้อม; 50001 เน้นสมรรถนะพลังงาน"], "answer": 3, "explain": "ระบบทั้งสองมีประเด็นเกี่ยวข้องกัน แต่ขอบเขตไม่เท่ากัน การลดพลังงานอาจช่วยด้านสิ่งแวดล้อมแต่ยังต้องจัดการน้ำเสีย ของเสียและผลกระทบอื่น.", "page": "7–8", "kind": "เข้าใจ"}, {"id": 32, "set": 1, "topic": 3, "q": "SOₓ, NOₓ และ PM จากหม้อไอน้ำอยู่ในกลุ่มใด?", "options": ["Noise", "Air emissions จากปล่อง", "Solid waste จากบรรจุภัณฑ์", "Thermal pollution ในน้ำเท่านั้น"], "answer": 1, "explain": "SOₓ และ NOₓ เป็นกลุ่มออกไซด์ของกำมะถันและไนโตรเจน ส่วน PM คืออนุภาค ต้องพิจารณาตามแหล่งกำเนิดและคุณสมบัติของมลพิษ.", "page": "8", "kind": "จำ"}, {"id": 33, "set": 1, "topic": 3, "q": "ไอสารอินทรีย์รั่วจากซีลปั๊มและหน้าแปลนเข้ากลุ่มใด?", "options": ["เสียงจากเครื่องจักร", "เฉพาะน้ำเสียจาก blowdown", "VOCs / Fugitive emissions", "กระดาษใช้แล้ว"], "answer": 2, "explain": "Fugitive emissions คือการปล่อยแบบรั่วไหลจากอุปกรณ์ ไม่จำเป็นต้องออกทางปล่อง และหากสารนั้นเป็นอินทรีย์ระเหยง่ายก็เป็น VOC ด้วย.", "page": "8", "kind": "จำ"}, {"id": 34, "set": 1, "topic": 3, "q": "ข้อใดเป็นแหล่งน้ำเสียตามสรุป?", "options": ["น้ำจากกระบวนการ น้ำ blowdown และน้ำฝนชะล้างที่ปนเปื้อน", "แผ่นกระดาษที่ม้วนแล้ว", "เสียงจากปั๊ม", "กระแสไฟฟ้าในมอเตอร์"], "answer": 0, "explain": "ต้องพิจารณาทั้งน้ำในกระบวนการและน้ำจาก utilities รวมถึงน้ำฝนที่สัมผัสสารปนเปื้อน ไม่ใช่นับเฉพาะน้ำจากสายผลิต.", "page": "8", "kind": "จำ"}, {"id": 35, "set": 1, "topic": 3, "q": "ข้อใดเป็นตัวอย่างที่ควรประเมินในกลุ่มของเสียอันตรายตามสรุป?", "options": ["น้ำดื่มที่ยังไม่ใช้", "ตัวเร่งปฏิกิริยาใช้แล้วและกากกลั่นที่มีสารอันตราย", "ไอน้ำสะอาด", "กระดาษสะอาดทุกแผ่นโดยอัตโนมัติ"], "answer": 1, "explain": "องค์ประกอบและคุณสมบัติอันตรายเป็นข้อมูลสำคัญในการจำแนก ไม่ควรตัดสินของเสียทุกชิ้นจากชื่อเรียกเพียงอย่างเดียว.", "page": "8 • ประยุกต์", "kind": "เข้าใจ"}, {"id": 36, "set": 1, "topic": 3, "q": "ตัวอย่างใดเหมาะกับกลุ่ม Solid waste ที่ไม่อันตราย หากไม่มีสารอันตรายปนเปื้อน?", "options": ["ไอกรดรั่ว", "ตัวทำละลายไวไฟใช้แล้ว", "บรรจุภัณฑ์สะอาดที่ใช้แล้ว", "กากที่มีสารพิษสูง"], "answer": 2, "explain": "ของแข็งไม่จำเป็นต้องเป็นของเสียอันตรายทั้งหมด และบรรจุภัณฑ์ที่ปนเปื้อนก็ไม่ควรถูกเหมารวมว่าไม่อันตราย.", "page": "8 • ประยุกต์", "kind": "เข้าใจ"}, {"id": 37, "set": 1, "topic": 3, "q": "สารกลุ่มใดเกี่ยวข้องกับกลิ่นในสรุป?", "options": ["NaCl บริสุทธิ์อย่างเดียว", "H₂S, mercaptans และ NH₃", "Cellulose แห้งบริสุทธิ์อย่างเดียว", "CaCO₃ ทุกกรณีเท่านั้น"], "answer": 1, "explain": "สรุปยกสารประกอบกำมะถันและไนโตรเจนเป็นตัวอย่างแหล่งกลิ่น กลิ่นไม่ใช่เครื่องมือยืนยันว่าความเข้มข้นของสารปลอดภัย.", "page": "8–9", "kind": "จำ"}, {"id": 38, "set": 1, "topic": 3, "q": "เสียงจาก compressor ปั๊ม และวาล์วที่ของไหลไหลเร็วจัดเป็นอะไร?", "options": ["Noise pollution", "Lignin removal", "GSM", "Brine purification"], "answer": 0, "explain": "แหล่งเสียงอาจมาจากการหมุน การสั่น และการไหลของของไหล การจัดการเริ่มจากระบุแหล่งกำเนิดและการรับสัมผัส.", "page": "8", "kind": "จำ"}, {"id": 39, "set": 1, "topic": 3, "q": "การปล่อยน้ำหล่อเย็นอุณหภูมิสูงลงแหล่งน้ำเป็นตัวอย่างของอะไร?", "options": ["Thermal pollution", "เฉพาะ VOC emission", "เฉพาะฝุ่นจากปล่อง", "Acute toxicity ของตะกั่วเสมอ"], "answer": 0, "explain": "แม้น้ำไม่มีสารเคมีปนเปื้อน ความร้อนก็อาจทำให้สภาพแวดล้อมของแหล่งรับน้ำเปลี่ยนไป จึงเป็นผลกระทบที่ต้องพิจารณาแยก.", "page": "8", "kind": "เข้าใจ"}, {"id": 40, "set": 1, "topic": 4, "q": "Chemical hazard หมายถึงอะไร?", "options": ["เฉพาะสารที่ติดไฟได้", "โอกาสเกิดเหตุเพียงอย่างเดียวโดยไม่ดูความรุนแรง", "เฉพาะกลิ่นที่ไม่พึงประสงค์", "คุณสมบัติหรือสภาวะที่มีศักยภาพก่ออันตรายจากสารเคมี"], "answer": 3, "explain": "Hazard คือศักยภาพก่ออันตราย ส่วน risk พิจารณาโอกาสและความรุนแรงภายใต้เงื่อนไขการสัมผัสหรือการใช้งานด้วย.", "page": "9 • ประยุกต์", "kind": "เข้าใจ"}, {"id": 41, "set": 1, "topic": 4, "q": "Acute toxicity ต่างจาก Chronic toxicity อย่างไร?", "options": ["ทั้งสองคือการกัดกร่อนโลหะอย่างเดียว", "เฉียบพลันเกี่ยวกับการสัมผัสระยะสั้น; เรื้อรังเกี่ยวกับการสัมผัสซ้ำหรือระยะยาว", "เรื้อรังไม่มีผลต่อสุขภาพ", "เฉียบพลันเกิดจากของแข็งเท่านั้น"], "answer": 1, "explain": "ระยะเวลาการสัมผัสและรูปแบบผลกระทบช่วยแยกแนวคิด สรุปใช้คลอรีนเป็นตัวอย่างพิษเฉียบพลัน และตะกั่ว/แร่ใยหินเป็นตัวอย่างอันตรายระยะยาว.", "page": "9", "kind": "จำ"}, {"id": 42, "set": 1, "topic": 4, "q": "เส้นทางเข้าสู่ร่างกายที่ควรพิจารณามีอะไรบ้าง?", "options": ["เฉพาะการสูดดม", "เฉพาะการได้ยินเสียง", "สูดดม ดูดซึมทางผิวหนัง กิน และฉีด/แทงเข้าสู่ร่างกาย", "เฉพาะการกิน"], "answer": 2, "explain": "ลักษณะงานกำหนดเส้นทางรับสัมผัส การควบคุมจึงต้องครอบคลุมมากกว่าหน้ากากเพียงอย่างเดียว.", "page": "9", "kind": "จำ"}, {"id": 43, "set": 1, "topic": 4, "q": "สัญลักษณ์หัวกะโหลกและกระดูกไขว้สื่อถึงอันตรายใด?", "options": ["ก๊าซภายใต้ความดัน", "อันตรายต่อสิ่งแวดล้อมทางน้ำ", "พิษเฉียบพลันที่รุนแรง", "สารออกซิไดซ์"], "answer": 2, "explain": "ต้องอ่านฉลากและ SDS ประกอบสัญลักษณ์ เพราะรูปหนึ่งรูปไม่ได้บอกข้อมูลอันตรายหรือวิธีป้องกันครบทั้งหมด.", "page": "9", "kind": "จำ"}, {"id": 44, "set": 1, "topic": 4, "q": "สัญลักษณ์รูปถังก๊าซสื่ออะไร?", "options": ["สารไม่มีอันตราย", "สารระเบิดทุกกรณี", "ก๊าซภายใต้ความดัน", "สารกัดกร่อนเท่านั้น"], "answer": 2, "explain": "ก๊าซภายใต้ความดันอาจมีอันตรายอื่นร่วม เช่น ไวไฟหรือเป็นพิษ จึงต้องดูข้อมูลทั้งหมดบนฉลากและ SDS.", "page": "9", "kind": "จำ"}, {"id": 45, "set": 1, "topic": 4, "q": "สารไวไฟกับสารออกซิไดซ์แตกต่างกันอย่างไร?", "options": ["สารไวไฟไม่ต้องมีแหล่งจุดติดในทุกกรณี", "สารไวไฟเป็นเชื้อเพลิงได้ง่าย; สารออกซิไดซ์ส่งเสริมการเผาไหม้ได้", "ทั้งสองต้องเก็บรวมกันเพื่อหักล้างอันตราย", "สารออกซิไดซ์ทุกชนิดเป็นเชื้อเพลิงเสมอ"], "answer": 1, "explain": "สารออกซิไดซ์ไม่จำเป็นต้องติดไฟเอง แต่ทำให้การเผาไหม้ของวัสดุอื่นรุนแรงขึ้น จึงต้องพิจารณาความเข้ากันได้ในการจัดเก็บ.", "page": "9", "kind": "เข้าใจ"}, {"id": 46, "set": 1, "topic": 4, "q": "Corrosivity หมายถึงคุณสมบัติใด?", "options": ["ลดความดันในถัง", "เกิดกลิ่นหอมเมื่อเจือจาง", "ทำลายเนื้อเยื่อหรือกัดกร่อนวัสดุ เช่น โลหะ", "เพิ่มความขาวของกระดาษเท่านั้น"], "answer": 2, "explain": "ทั้งกรดและเบสบางชนิดมีฤทธิ์กัดกร่อน ตัวอย่างในสรุปคือกรดซัลฟิวริก กรดไฮโดรคลอริก และโซดาไฟ การเลือกวัสดุและ PPE ต้องอิงสารจริง.", "page": "9", "kind": "จำ"}, {"id": 47, "set": 1, "topic": 4, "q": "Unstable reactive หมายถึงสารลักษณะใด?", "options": ["ไม่มีอันตรายถ้าไม่มีกลิ่น", "ต้องเป็นผงไม้เท่านั้น", "อาจสลายตัว พอลิเมอไรซ์ หรือเกิดปฏิกิริยารุนแรงเมื่อถูกกระตุ้น", "ไม่เปลี่ยนแปลงไม่ว่าอุณหภูมิใด"], "answer": 2, "explain": "สิ่งกระตุ้นอาจเป็นอุณหภูมิ แรงกระแทก หรือสภาวะอื่นตามชนิดสาร จึงต้องตรวจสอบข้อจำกัดและสารที่เข้ากันไม่ได้จาก SDS.", "page": "9", "kind": "เข้าใจ"}, {"id": 48, "set": 1, "topic": 4, "q": "Dust explosion pentagon มีองค์ประกอบครบในข้อใด?", "options": ["เชื้อเพลิง ออกซิเจน แหล่งจุดติด เท่านั้น", "น้ำ เกลือ ไอน้ำ แรงเหวี่ยง และความขาว", "ความดัน อุณหภูมิ GSM ความเร็ว และความหนา", "ฝุ่นติดไฟ ออกซิเจน แหล่งจุดติด การฟุ้งกระจาย และการกักล้อม"], "answer": 3, "explain": "นอกจากสามเหลี่ยมไฟ ฝุ่นระเบิดยังต้องพิจารณาการกระจายตัวเป็นเมฆฝุ่นและการกักล้อม พื้นที่กักล้อมนี้ไม่จำเป็นต้องตรงนิยามทางกฎหมายของ confined space.", "page": "9", "kind": "จำ"}, {"id": 49, "set": 1, "topic": 4, "q": "การเลือก PPE สำหรับงานสารเคมีควรอาศัยอะไร?", "options": ["อันตราย เส้นทางสัมผัส สภาวะงาน และข้อมูลความทนสารของอุปกรณ์", "หน้ากากทั่วไปป้องกันก๊าซทุกชนิดได้", "ถุงมือชนิดใดก็ใช้กับทุกสารได้", "เลือกสีให้ตรงกับเครื่องจักร"], "answer": 0, "explain": "PPE ต้องเหมาะกับสาร ความเข้มข้นและลักษณะการสัมผัส ใช้ประกอบมาตรการควบคุมอื่น ไม่ใช่ทดแทนการควบคุมแหล่งกำเนิดทั้งหมด.", "page": "9 • ประยุกต์", "kind": "เข้าใจ"}, {"id": 50, "set": 2, "topic": 0, "q": "น้ำเกลือยังมี Ca²⁺ สูงหลัง purification ควรตรวจส่วนใดก่อนส่งไปใช้ต่อ?", "options": ["เพิ่มความเร็ว winder", "ลดจำนวนมิเตอร์ไฟฟ้า", "ความเงาของเม็ดเกลือหลังอบเท่านั้น", "การจ่าย Na₂CO₃ การทำปฏิกิริยา และการแยกตะกอน"], "answer": 3, "explain": "Ca²⁺ ต้องทำปฏิกิริยากับ carbonate และแยก CaCO₃ ออก ปัญหาอาจอยู่ที่สารเคมีไม่พอ การสัมผัส/เวลา หรือแยกตะกอนไม่ดี ไม่ควรข้ามไปแก้ dryer.", "page": "2 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 51, "set": 2, "topic": 0, "q": "น้ำเกลือมี Mg²⁺ 10 mol ต้องใช้ OH⁻ ตามทฤษฎีกี่ mol และได้ตะกอนอะไร?", "options": ["10 mol OH⁻ และ MgCl₂", "20 mol OH⁻ และ Mg(OH)₂", "20 mol OH⁻ และ NaCl", "5 mol OH⁻ และ MgCO₃"], "answer": 1, "explain": "จาก Mg²⁺ + 2OH⁻ → Mg(OH)₂ ต้องใช้ OH⁻ เป็นสองเท่าของ Mg²⁺ นี่คือสัดส่วนทฤษฎี ไม่ใช่ปริมาณจ่ายสารจริงที่คำนึงถึงสมดุลและสภาวะโรงงานแล้ว.", "page": "2 • ประยุกต์", "kind": "คำนวณ"}, {"id": 52, "set": 2, "topic": 0, "q": "เหตุใดการนำ brine ที่แยกได้จาก sludge กลับคืนจึงมีประโยชน์?", "options": ["ทำให้ไม่ต้องตรวจคุณภาพ brine อีก", "ทำให้ NaCl เปลี่ยนเป็น NaOH โดยไม่มีไฟฟ้า", "ลดการสูญเสียน้ำเกลือที่ติดไปกับตะกอน", "ทำให้ตะกอนทุกชนิดกลายเป็นอาหาร"], "answer": 2, "explain": "การกู้คืนของเหลวลดการสูญเสียวัตถุดิบ แต่ยังต้องควบคุมสิ่งเจือปนก่อนนำกลับเข้ากระบวนการ.", "page": "2 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 53, "set": 2, "topic": 0, "q": "ถ้าเอฟเฟกต์ถัดไปมีอุณหภูมิเดือดเท่ากับอุณหภูมิไอร้อนที่ป้อน จะเกิดข้อจำกัดใด?", "options": ["ตะกอน CaCO₃ หายไปทันที", "การระเหยเพิ่มขึ้นไม่จำกัด", "NaCl ระเหยแทนน้ำทั้งหมด", "แรงขับอุณหภูมิในการถ่ายเทความร้อนต่ำมาก"], "answer": 3, "explain": "การถ่ายเทความร้อนต้องมีผลต่างอุณหภูมิ จึงจัดระดับความดันให้ไอจากเอฟเฟกต์ก่อนหน้าร้อนกว่าของเหลวที่เดือดในเอฟเฟกต์ถัดไป.", "page": "3 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 54, "set": 2, "topic": 0, "q": "ถ้า Centrifuge แยกน้ำออกได้น้อยลง ผลที่น่าจะเกิดกับ Dryer ที่ผลิตเกลือสเปกเดิมคืออะไร?", "options": ["พลังงานลดลงเสมอ", "ได้ Cl₂ มากขึ้นทันที", "ไม่เกี่ยวกันเพราะไม่มีน้ำเข้า dryer", "ภาระการระเหยและพลังงานที่ต้องใช้เพิ่มขึ้น"], "answer": 3, "explain": "เกลือเปียกขึ้นหมายถึงน้ำที่ต้องระเหยเพิ่มขึ้น ควรดูการแยกเชิงกลก่อนเพิ่มภาระความร้อนอย่างเดียว.", "page": "3 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 55, "set": 2, "topic": 0, "q": "หากกระแสไฟและประสิทธิภาพคงเดิม แต่เพิ่มเวลา electrolysis เป็นสองเท่า ปริมาณ Cl₂ จะเปลี่ยนอย่างไร?", "options": ["เพิ่มเป็นสองเท่า", "เท่าเดิม", "เพิ่มสี่เท่า", "เหลือครึ่งหนึ่ง"], "answer": 0, "explain": "Q = It และ n(Cl₂) = Q/(2F) ปริมาณผลิตจึงแปรตามเวลาเมื่อกระแสและประสิทธิภาพกระแสคงที่.", "page": "3 • ประยุกต์", "kind": "เข้าใจ"}, {"id": 56, "set": 2, "topic": 0, "q": "ใช้ 25,000 A นาน 2 ชั่วโมง, F = 96,500 C/mol e⁻, Vₘ = 24 L/mol, ประสิทธิภาพกระแส 90% ได้ Cl₂ ประมาณเท่าไร?", "options": ["2,014.5 L", "22,383 L", "20,145 L", "40,290 L"], "answer": 2, "explain": "Q = 25,000 × 7,200 = 180,000,000 C; V จริง = Q/(2F) × 24 × 0.90 = 20,145.08 L ประจุเท่าตัวอย่างเดิม แต่ได้ผลผลิตจริงลดตามประสิทธิภาพ.", "page": "3 • ประยุกต์", "kind": "คำนวณ"}, {"id": 57, "set": 2, "topic": 0, "q": "ถ้าผลิต Cl₂ ได้ 100 mol ตามสมการรวม จะได้ NaOH และ H₂ เท่าไร?", "options": ["NaOH 200 mol และ H₂ 100 mol", "NaOH 50 mol และ H₂ 50 mol", "NaOH 100 mol และ H₂ 200 mol", "NaOH 200 mol และ H₂ 200 mol"], "answer": 0, "explain": "2NaCl + 2H₂O → 2NaOH + H₂ + Cl₂ จึงมีอัตราส่วน NaOH:H₂:Cl₂ = 2:1:1 ในเชิงทฤษฎี.", "page": "2 • ประยุกต์", "kind": "คำนวณ"}, {"id": 58, "set": 2, "topic": 0, "q": "เพื่อนกล่าวว่า “Na₂CO₃ อยู่ในหัวข้อ industrial salt ดังนั้นเซลล์ chlor-alkali ผลิตมันโดยตรง” ควรแก้อย่างไร?", "options": ["ผิด เพราะเซลล์ผลิตเฉพาะ O₂", "ความเกี่ยวข้องกับเกลือไม่เท่ากับเป็นผลิตภัณฑ์ของเซลล์; เซลล์ผลิต NaOH, H₂, Cl₂", "ถูก เพราะ Na₂CO₃ กับ NaOH เป็นสารเดียวกัน", "ถูก เพราะ CO₂ เกิดจากน้ำบริสุทธิ์เสมอ"], "answer": 1, "explain": "แยกความหมายของวัตถุดิบในอุตสาหกรรมออกจากสมการปฏิกิริยา ในสมการ chlor-alkali ไม่มีแหล่งคาร์บอนที่จะสร้าง carbonate โดยตรง.", "page": "2 • แก้ความคลาดเคลื่อน", "kind": "วิเคราะห์"}, {"id": 59, "set": 2, "topic": 0, "q": "Salt slurry กับ Purified brine ต่างกันอย่างไร?", "options": ["Purified brine คือ Cl₂ บริสุทธิ์", "ทั้งคู่เป็นเกลือแห้ง 100%", "Slurry มีผลึกแขวนลอยในของเหลว; purified brine คือน้ำเกลือที่ลดสิ่งเจือปนแล้ว", "Slurry เป็นชื่อของ NaOH เท่านั้น"], "answer": 2, "explain": "คำว่า purified บอกคุณภาพด้านสิ่งเจือปน ส่วน slurry บอกลักษณะของระบบที่มีของแข็งกระจายในของเหลว จึงใช้แทนกันไม่ได้.", "page": "2–3", "kind": "เข้าใจ"}, {"id": 60, "set": 2, "topic": 1, "q": "ต้องการเยื่อที่ yield สูงและยอมรับการเหลืองง่ายกว่าได้ วิธีใดสอดคล้องกับตารางในสรุป?", "options": ["Mechanical pulping", "Electrolysis ของน้ำเกลือ", "Chemical pulping ที่กำจัด lignin มาก", "การเพิ่ม bleaching จนกำจัด lignin หมด"], "answer": 0, "explain": "เยื่อทางกลคงองค์ประกอบไม้ไว้มากกว่า จึงได้ yield สูงกว่าในตารางตัวอย่าง แต่ lignin ที่เหลือทำให้ความคงทนของความขาวด้อยกว่า ค่าร้อยละจริงขึ้นกับกระบวนการ.", "page": "4–5", "kind": "วิเคราะห์"}, {"id": 61, "set": 2, "topic": 1, "q": "นำเปลือกไม้ที่แยกออกไปใช้เป็นเชื้อเพลิง ให้ประโยชน์ด้านใดโดยตรง?", "options": ["เพิ่ม GSM โดยไม่ใช้เส้นใย", "ใช้ประโยชน์จากวัสดุพลอยได้เพื่อให้ความร้อน", "แทนที่การควบคุมมลพิษได้ทั้งหมด", "เพิ่มประสิทธิภาพกระแส electrolysis"], "answer": 1, "explain": "เปลือกไม้ใช้เป็น biofuel ได้ แต่การใช้ชีวมวลยังต้องจัดการการเผาไหม้ เถ้าและการปล่อยอากาศ ไม่ได้แปลว่าไม่มีผลกระทบ.", "page": "4, 7–8 • บูรณาการ", "kind": "วิเคราะห์"}, {"id": 62, "set": 2, "topic": 1, "q": "พบชิ้นไม้ขนาดใหญ่มากปนกับเล็กมากก่อน Digester ควรทบทวนขั้นตอนใด?", "options": ["Chipping และ chip screening", "Reel และ Winder", "การตกตะกอน Mg²⁺", "Calender เท่านั้น"], "answer": 0, "explain": "การเตรียมและคัดชิ้นไม้เป็นจุดควบคุมขนาดก่อนต้ม ขนาดไม่สม่ำเสมอทำให้การสัมผัสน้ำยาและการต้มไม่สม่ำเสมอได้.", "page": "4–5 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 63, "set": 2, "topic": 1, "q": "เหตุใดจึงมี Oxygen delignification ก่อน bleaching ในสายเยื่อเคมี?", "options": ["เติม lignin กลับให้เยื่อเป็นสีดำ", "ลด lignin ที่ตกค้างและลดภาระของขั้นฟอกต่อไป", "เพิ่มเปลือกไม้ในกระดาษ", "ทำให้ไม่ต้องล้างเยื่อทุกกรณี"], "answer": 1, "explain": "O₂ ร่วมกับด่างช่วยลด lignin หลังการต้ม จึงเตรียมเยื่อให้เหมาะกับการฟอกขาวขั้นถัดไป ไม่ใช่ขั้นขึ้นรูปแผ่น.", "page": "5", "kind": "เข้าใจ"}, {"id": 64, "set": 2, "topic": 1, "q": "Headbox จ่ายเยื่อไม่สม่ำเสมอ สิ่งใดมีแนวโน้มได้รับผลโดยตรง?", "options": ["องค์ประกอบของ white liquor โดยตรงเสมอ", "ปริมาณ Ca²⁺ ในเหมืองเกลือเท่านั้น", "จำนวนโมล Cl₂ ที่แอโนด", "ความสม่ำเสมอของแผ่นและมวลต่อพื้นที่"], "answer": 3, "explain": "Headbox มีหน้าที่กระจาย slurry บน wire อย่างสม่ำเสมอ ความผิดปกติในการจ่ายจึงส่งผลต่อการกระจายเส้นใยและแผ่นที่ขึ้นรูป.", "page": "5 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 65, "set": 2, "topic": 1, "q": "ของแข็งแห้ง 100 kg/h ออกจาก Press ที่ dry content 40% และเข้า Dryer จนเป็น 50% ก่อนขั้นอื่น น้ำในกระแสลดไปเท่าไร โดยของแข็งไม่สูญเสีย?", "options": ["50 kg/h", "100 kg/h", "150 kg/h", "10 kg/h"], "answer": 0, "explain": "ที่ 40% มวลรวม = 100/0.40 = 250 และน้ำ = 150 kg/h; ที่ 50% มวลรวม = 200 และน้ำ = 100 kg/h จึงลดน้ำ 50 kg/h. Dry content = ของแข็งแห้ง/มวลรวม.", "page": "5–6 • ประยุกต์", "kind": "คำนวณ"}, {"id": 66, "set": 2, "topic": 1, "q": "ปรับ Press ให้กำจัดน้ำเพิ่มได้โดยคุณภาพไม่เสีย เหตุใดจึงมักลดพลังงานรวม?", "options": ["เปลี่ยน cellulose เป็นเชื้อเพลิงทั้งหมด", "ทำให้น้ำไม่มีความร้อนแฝง", "ทำให้ไม่ต้องใช้มอเตอร์เลย", "ลดน้ำที่ต้องเปลี่ยนเป็นไอใน Dryer"], "answer": 3, "explain": "การกำจัดน้ำเชิงกลใช้พลังงานต่ำกว่าการระเหยน้ำปริมาณเดียวกันโดยทั่วไป แต่ต้องคุมข้อจำกัดเรื่องคุณภาพแผ่นและการเดินเครื่อง.", "page": "5–7 • บูรณาการ", "kind": "วิเคราะห์"}, {"id": 67, "set": 2, "topic": 1, "q": "กระดาษสองชนิดมี GSM เท่ากัน แต่ความหนาต่างกัน ข้อใดถูกต้อง?", "options": ["ต้องมีพื้นที่แผ่นต่างกันเสมอ", "เป็นไปไม่ได้ เพราะ GSM คือความหนาเป็น mm", "ต้องมีน้ำหนักต่อแผ่นเท่ากันแม้พื้นที่ต่างกัน", "เป็นไปได้ เพราะมวลต่อพื้นที่เท่ากันไม่ได้แปลว่าความหนาแน่นเท่ากัน"], "answer": 3, "explain": "GSM = มวล/พื้นที่ และสัมพันธ์กับความหนาผ่านความหนาแน่นเชิงปรากฏ หากโครงสร้างหรือการอัดแน่นต่างกัน ความหนาก็ต่างได้.", "page": "6 • แก้ความคลาดเคลื่อน", "kind": "วิเคราะห์"}, {"id": 68, "set": 2, "topic": 1, "q": "เครื่องผลิตกระดาษ 500 ton/day, 50 g/m², กว้าง 10 m เดิน 24 ชั่วโมง ไม่มีของเสีย ต้องวิ่งกี่ m/min?", "options": ["34.72 m/min", "6,944.44 m/min", "69.44 m/min", "694.44 m/min"], "answer": 3, "explain": "มวล = 500,000,000 g/day; พื้นที่ = มวล/50 = 10,000,000 m²/day; ความเร็ว = พื้นที่/(10 × 1,440) = 694.44 m/min. อย่าลืมหารความกว้าง.", "page": "6", "kind": "คำนวณ"}, {"id": 69, "set": 2, "topic": 1, "q": "ที่ความกว้างและความเร็วเครื่องเท่าเดิม หากเพิ่ม GSM จาก 50 เป็น 80 โดยไม่มีของเสีย อัตราการผลิตมวลจะเปลี่ยนอย่างไร?", "options": ["เท่าเดิม", "ลดเหลือ 0.625 เท่า", "เพิ่มเป็น 1.6 เท่า", "เพิ่มเป็น 2.6 เท่า"], "answer": 2, "explain": "มวลต่อเวลา = GSM × ความกว้าง × ความเร็ว อัตราส่วนจึงเท่ากับ 80/50 = 1.6 ภายใต้สมมติฐานว่าเครื่องรักษาความเร็วและคุณภาพได้.", "page": "6 • ประยุกต์", "kind": "คำนวณ"}, {"id": 70, "set": 2, "topic": 2, "q": "เดือนแรกใช้ 100,000 kWh ผลิต 1,000 ton เดือนถัดไป 90,000 kWh ผลิต 750 ton ข้อใดถูกต้อง?", "options": ["ไม่สามารถคำนวณ kWh/ton ได้", "EnPI ลดจาก 120 เป็น 100", "พลังงานรวมลด แต่ kWh/ton เพิ่มจาก 100 เป็น 120", "ประสิทธิภาพดีขึ้นแน่นอนเพราะค่าไฟลด"], "answer": 2, "explain": "เดือนแรก 100,000/1,000 = 100; เดือนหลัง 90,000/750 = 120 kWh/ton ตัวชี้วัดต่อหน่วยแย่ลง แต่การสรุปสาเหตุยังต้องดูเกรดผลิตภัณฑ์และภาระคงที่ด้วย.", "page": "7 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 71, "set": 2, "topic": 2, "q": "หลังโครงการประหยัดพลังงาน ผลิตภัณฑ์เปลี่ยนชนิดและปริมาณมาก ควรเทียบ EnB อย่างไร?", "options": ["เปลี่ยนฐานให้ตรงผลใหม่เสมอโดยไม่มีเหตุผล", "เทียบค่าไฟรวมอย่างเดียว", "ปรับการเปรียบเทียบให้สะท้อนตัวแปรที่เกี่ยวข้องก่อนสรุปผล", "เลิกใช้ EnPI"], "answer": 2, "explain": "ฐานเปรียบเทียบต้องเป็นธรรมต่อสภาพการผลิต การปรับตามตัวแปรที่เกี่ยวข้องช่วยแยกผลของมาตรการออกจากผลของปริมาณหรือชนิดผลิตภัณฑ์.", "page": "7 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 72, "set": 2, "topic": 2, "q": "มิเตอร์แจ้งใช้ไอน้ำสูงผิดปกติทั้งที่อัตราผลิตเท่าเดิม ควรเริ่มอย่างไร?", "options": ["เปลี่ยนทุกเครื่องทันทีโดยไม่วิเคราะห์", "ตรวจความน่าเชื่อถือของข้อมูลและสำรวจจุดสูญเสีย เช่น steam trap", "สรุปว่าไม่มีการรั่วเพราะยังผลิตได้", "ลบข้อมูลช่วงผิดปกติ"], "answer": 1, "explain": "Advanced monitoring ช่วยชี้เป้า แต่ควรยืนยันข้อมูลและสภาพหน้างานก่อนเลือกมาตรการ ไม่ใช่ตัดสินจากสัญญาณเดียว.", "page": "7 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 73, "set": 2, "topic": 2, "q": "ให้ความร้อนวัสดุ 5,000 kg/h, Cp = 2.0 kJ/(kg·°C), จาก 25 เป็น 120°C ต้องใช้ useful heat เท่าไร?", "options": ["1,200,000 kJ/h", "95,000 kJ/h", "950,000 kJ/h", "1,187,500 kJ/h"], "answer": 2, "explain": "Q̇useful = ṁCpΔT = 5,000 × 2.0 × (120−25) = 950,000 kJ/h. ต้องใช้ผลต่างอุณหภูมิ ไม่ใช่อุณหภูมิปลายทางอย่างเดียว.", "page": "7", "kind": "คำนวณ"}, {"id": 74, "set": 2, "topic": 2, "q": "จาก useful heat 950,000 kJ/h และประสิทธิภาพเตา 80% ต้องป้อนพลังงานเท่าไร?", "options": ["1,187,500 kJ/h หรือ 329.86 kW", "950,000 kJ/h หรือ 263.89 kW", "1,187,500 kW", "760,000 kJ/h หรือ 211.11 kW"], "answer": 0, "explain": "Q̇input = Q̇useful/η = 950,000/0.80 = 1,187,500 kJ/h; หาร 3,600 ได้ 329.86 kW. kWh เป็นพลังงาน ส่วน kW เป็นอัตราการใช้พลังงาน.", "page": "7", "kind": "คำนวณ"}, {"id": 75, "set": 2, "topic": 2, "q": "หากรักษา useful heat 950,000 kJ/h แต่เพิ่มประสิทธิภาพจาก 80% เป็น 90% จะลดพลังงานป้อนจากเดิมกี่เปอร์เซ็นต์?", "options": ["10%", "11.11%", "20%", "90%"], "answer": 1, "explain": "เดิม input = 950,000/0.80; ใหม่ = 950,000/0.90. สัดส่วนลด = 1−0.80/0.90 = 0.1111 หรือ 11.11% ไม่เท่ากับส่วนต่างประสิทธิภาพ 10 จุดเปอร์เซ็นต์.", "page": "7 • ประยุกต์", "kind": "คำนวณ"}, {"id": 76, "set": 2, "topic": 2, "q": "จากเตาประสิทธิภาพ 80% หากต้องการลด input ลง 20% แต่ useful heat เท่าเดิม ประสิทธิภาพใหม่ต้องเป็นเท่าไร?", "options": ["64%", "96%", "80% เท่าเดิม", "100% ซึ่งเป็นขีดจำกัดอุดมคติของสมดุลนี้"], "answer": 3, "explain": "input ใหม่ = 0.8 × input เดิม; ηใหม่ = ηเดิม/0.8 = 1.00. เป้าหมายจึงไม่ควรถูกมองว่าเป็นการปรับง่าย ๆ; อาจต้องลดภาระความร้อนหรือกู้คืนความร้อนร่วมด้วย.", "page": "7 • ขยายความตัวอย่าง", "kind": "วิเคราะห์"}, {"id": 77, "set": 2, "topic": 2, "q": "ไอน้ำเดิม 10,000 kg/h ลดได้ 15% ที่ชั่วโมงเดินเครื่องเดิม อัตราการใช้ใหม่เท่าไร?", "options": ["9,850 kg/h", "8,500 kg/h", "1,500 kg/h", "11,500 kg/h"], "answer": 1, "explain": "อัตราที่ประหยัด = 1,500 kg/h แต่สิ่งที่ถามคืออัตราที่เหลือ = 10,000 × (1−0.15) = 8,500 kg/h.", "page": "7 • ประยุกต์", "kind": "คำนวณ"}, {"id": 78, "set": 2, "topic": 2, "q": "กำลังเฉลี่ย 329.86 kW เดิน 8 ชั่วโมง ใช้พลังงานประมาณเท่าไร?", "options": ["41.23 kWh", "2,638.88 kWh", "329.86 kWh เสมอ", "2,638.88 kW/h"], "answer": 1, "explain": "พลังงาน = กำลัง × เวลา = 329.86 × 8 = 2,638.88 kWh. หน่วย kW/h เป็นอัตราการเปลี่ยนกำลัง ไม่ใช่พลังงานที่ใช้.", "page": "7 • ประยุกต์", "kind": "คำนวณ"}, {"id": 79, "set": 2, "topic": 2, "q": "ใน PDCA การเปรียบเทียบผล EnPI หลังทำโครงการกับเป้าหมายเป็นขั้นใด?", "options": ["Plan", "Check", "Do", "ไม่มีใน PDCA"], "answer": 1, "explain": "Plan วางแผน; Do ดำเนินการ; Check วัดและประเมินผล; Act ปรับปรุง/แก้ไขเพื่อวงรอบถัดไป การประเมินผลจึงอยู่ใน Check.", "page": "7 • ประยุกต์", "kind": "เข้าใจ"}, {"id": 80, "set": 2, "topic": 3, "q": "โรงงานลดการใช้ไฟได้ แต่มีน้ำเสียเพิ่มขึ้น ควรสรุปอย่างไร?", "options": ["ผ่านการจัดการสิ่งแวดล้อมทั้งหมดแล้ว", "น้ำเสียไม่อยู่ใน EMS", "ผลด้านพลังงานดีขึ้นบางส่วน แต่ต้องประเมินผลกระทบสิ่งแวดล้อมด้านอื่นต่อ", "ต้องเพิ่มไฟฟ้าจึงจะลดน้ำเสียได้เสมอ"], "answer": 2, "explain": "ISO 14001 มองผลกระทบหลายมิติ จึงไม่ใช้ผลสำเร็จด้านเดียวตัดสินทั้งระบบ การปรับปรุงอาจย้ายภาระจากด้านหนึ่งสู่อีกด้านได้.", "page": "7–8 • บูรณาการ", "kind": "วิเคราะห์"}, {"id": 81, "set": 2, "topic": 3, "q": "ปั๊มตัวทำละลายมีไอรั่วที่ซีล แต่ค่าที่ปล่องปกติ ควรตีความอย่างไร?", "options": ["ยังอาจมี fugitive emission ซึ่งค่าปล่องไม่ครอบคลุม", "เป็น thermal pollution เท่านั้น", "เป็นขยะกระดาษเท่านั้น", "ไม่มีการปล่อยอากาศเพราะปล่องปกติ"], "answer": 0, "explain": "แหล่งรั่วที่ซีลอยู่นอกเส้นทางปล่อง การสำรวจจึงต้องครอบคลุมแหล่งปล่อยแบบรั่วไหลด้วย.", "page": "8 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 82, "set": 2, "topic": 3, "q": "น้ำฝนไหลผ่านลานเก็บสารเคมีก่อนเข้าท่อระบาย ควรพิจารณาอะไร?", "options": ["โอกาสปนเปื้อนและการจัดการน้ำไหลบ่าจากพื้นที่นั้น", "ถือเป็นน้ำสะอาดเสมอเพราะมาจากฝน", "นับเป็นก๊าซภายใต้ความดัน", "วัดเฉพาะเสียงฝน"], "answer": 0, "explain": "ต้นกำเนิดเป็นฝนไม่ได้รับรองว่าสะอาด หลังสัมผัสพื้นที่เก็บสารอาจพาสารปนเปื้อนไปยังระบบระบายและแหล่งน้ำ.", "page": "8 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 83, "set": 2, "topic": 3, "q": "ถังบรรจุสารเคมีใช้หมดแล้ว ควรจัดเป็นของเสียไม่อันตรายทันทีหรือไม่?", "options": ["ใช่ ถังทุกชนิดเป็นขยะทั่วไป", "ไม่ ควรดูสารตกค้างและเกณฑ์จำแนกที่ใช้บังคับ", "ใช่ เพราะไม่มีของเหลวที่มองเห็น", "ไม่ เพราะถังทุกชนิดเป็นของเสียอันตรายเสมอ"], "answer": 1, "explain": "การไม่มีของเหลวที่เห็นไม่ได้แปลว่าไม่มีสารตกค้าง และไม่ควรเหมารวมในทางกลับกัน ต้องใช้ข้อมูลจริงในการจำแนก.", "page": "8 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 84, "set": 2, "topic": 3, "q": "สลัดจ์ชีวภาพในสรุปถูกยกเป็นตัวอย่าง solid waste ถ้าโรงงานมีโลหะหนักปน ควรทำอย่างไร?", "options": ["ใช้ชื่อ “ชีวภาพ” ยืนยันว่าไม่อันตรายเสมอ", "เปลี่ยนชื่อเป็นตะกอนเกลือแล้วทิ้งทั่วไป", "ประเมินองค์ประกอบและคุณสมบัติอันตรายก่อนจำแนก", "ดูสีอย่างเดียว"], "answer": 2, "explain": "ประเภทของเสียขึ้นกับคุณสมบัติและการปนเปื้อนจริง ตัวอย่างในเอกสารไม่ใช่ข้อยกเว้นที่ใช้ได้กับทุกโรงงาน.", "page": "8 • ขยายความ", "kind": "วิเคราะห์"}, {"id": 85, "set": 2, "topic": 3, "q": "น้ำทิ้งใสแต่ร้อนกว่าสภาพแหล่งรับมาก จะตัดประเด็นสิ่งแวดล้อมทิ้งได้หรือไม่?", "options": ["ได้ ถ้าไม่เห็นตะกอน", "ได้ ถ้าไม่มีกลิ่น", "ไม่ได้ ยังมีประเด็น thermal pollution", "ได้ เพราะความใสยืนยันทุกคุณภาพ"], "answer": 2, "explain": "สี กลิ่น และความใสไม่ครอบคลุมผลกระทบทั้งหมด ต้องพิจารณาอุณหภูมิและคุณภาพอื่นตามบริบทด้วย.", "page": "8 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 86, "set": 2, "topic": 3, "q": "ลดเสียงที่คนงานด้วยอุปกรณ์ป้องกันการได้ยินเพียงอย่างเดียว แก้เสียงรบกวนชุมชนครบหรือไม่?", "options": ["ครบ ถ้ามอเตอร์ยังหมุน", "ครบ เพราะคนงานไม่ได้ยินแล้ว", "ไม่ เพราะยังไม่ได้ลดเสียงจากแหล่งกำเนิดหรือทางแพร่กระจายสู่ชุมชน", "เสียงไม่ใช่ผลกระทบสิ่งแวดล้อม"], "answer": 2, "explain": "มาตรการที่ผู้รับสัมผัสหนึ่งคนไม่ได้แก้การแพร่เสียงไปยังผู้รับอื่น ต้องพิจารณาแหล่งกำเนิด เส้นทาง และผู้ได้รับผลกระทบ.", "page": "8–9 • บูรณาการ", "kind": "วิเคราะห์"}, {"id": 87, "set": 2, "topic": 3, "q": "โรงงานเยื่อมีน้ำเสียสีเข้มและกลิ่น แม้ติดระบบบำบัดแล้ว ควรสรุปอย่างไร?", "options": ["น้ำเสียทั้งหมดกลายเป็นน้ำดื่มทันที", "มีระบบแปลว่าผ่านทุกกรณี", "กลิ่นไม่เกี่ยวกับกระบวนการผลิต", "ต้องประเมินผลการบำบัดและพารามิเตอร์ที่เกี่ยวข้อง ไม่ใช่ดูว่ามีระบบแล้วพอ"], "answer": 3, "explain": "เอกสารแสดงประเด็นสีและกลิ่นในอุตสาหกรรมเยื่อ การมีอุปกรณ์ไม่เท่ากับผลลัพธ์ผ่านเป้าหมาย ต้องตรวจประสิทธิผลจริง.", "page": "4, 8 • บูรณาการ", "kind": "วิเคราะห์"}, {"id": 88, "set": 2, "topic": 3, "q": "การนำความร้อนไอเสียกลับมาใช้เชื่อมโยงพลังงานกับสิ่งแวดล้อมอย่างไร?", "options": ["เพิ่ม GSM โดยตรง", "อาจลดเชื้อเพลิงที่ต้องซื้อและการปล่อยที่สัมพันธ์กับการเผาไหม้", "แทนที่การจัดการของเสียอันตรายทั้งหมด", "ทำให้มลพิษทุกชนิดเป็นศูนย์โดยอัตโนมัติ"], "answer": 1, "explain": "การกู้คืนความร้อนลดความต้องการพลังงานใหม่ได้ แต่ไม่ใช่หลักฐานว่ามลพิษทุกชนิดลดในสัดส่วนเดียวกัน ต้องตรวจผลจริงและข้อจำกัดของระบบ.", "page": "7–8 • บูรณาการ", "kind": "วิเคราะห์"}, {"id": 89, "set": 2, "topic": 3, "q": "ใน EMS โรงงานกำหนดเป้าหมายลดน้ำเสีย แล้วติดตามผลและแก้เมื่อไม่บรรลุ สะท้อนแนวคิดใด?", "options": ["ทำครั้งเดียวแล้วไม่ต้องวัดอีก", "การเปลี่ยนหน่วย GSM เป็น kW", "การจัดเก็บตามลำดับตัวอักษร", "การปรับปรุงต่อเนื่องตาม PDCA"], "answer": 3, "explain": "มีทั้งการวางแผน ลงมือ ตรวจผล และปรับแก้ ทำให้ระบบจัดการเป็นวงรอบเรียนรู้ ไม่ใช่เพียงจัดทำเอกสารครั้งเดียว.", "page": "8 • ประยุกต์", "kind": "เข้าใจ"}, {"id": 90, "set": 2, "topic": 4, "q": "สารไม่มีสัญลักษณ์เปลวไฟ แต่มีเปลวไฟเหนือวงกลม ควรตีความอย่างไร?", "options": ["ไม่มีอันตรายเกี่ยวกับไฟทุกกรณี", "เป็นสารออกซิไดซ์ที่อาจส่งเสริมการเผาไหม้ของสารอื่น", "เป็นน้ำเปล่า", "เป็นสารไวไฟเท่านั้นและไม่มีอันตรายอื่น"], "answer": 1, "explain": "เปลวไฟเหนือวงกลมคือ oxidizer ต่างจากรูปเปลวไฟของสารไวไฟ การไม่ใช่เชื้อเพลิงเองไม่ได้แปลว่าเก็บใกล้วัสดุติดไฟได้โดยไม่ประเมิน.", "page": "9", "kind": "วิเคราะห์"}, {"id": 91, "set": 2, "topic": 4, "q": "ต้องจัดเก็บกรด เบส และสารออกซิไดซ์ ควรใช้หลักใด?", "options": ["ผสมตัวอย่างทุกคู่เพื่อทดสอบเอง", "เรียงตามตัวอักษรเพียงอย่างเดียว", "เก็บสารทุกชนิดในถาดเดียว", "ตรวจ SDS และตารางความเข้ากันได้ แล้วแยกตามอันตราย"], "answer": 3, "explain": "ความเข้ากันได้ทางเคมีสำคัญกว่าชื่อหรือความสะดวกในการจัดวาง และต้องใช้ข้อมูลเฉพาะสาร เพราะการแบ่งเพียงกรด/เบสอาจยังไม่ครบ.", "page": "9 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 92, "set": 2, "topic": 4, "q": "พบฝุ่นไม้สะสมใกล้เครื่องจักร หากฟุ้งขึ้นในอุปกรณ์ปิดและมีประกายไฟ เหตุใดจึงน่ากังวล?", "options": ["มีประกายไฟจึงช่วยกำจัดฝุ่นอย่างปลอดภัย", "ฝุ่นไม้ไม่อาจเป็นเชื้อเพลิง", "เกิดเฉพาะเมื่อมี Cl₂ เท่านั้น", "อาจมีองค์ประกอบของ dust explosion pentagon ครบ"], "answer": 3, "explain": "ฝุ่นไม้ติดไฟได้ เมื่อมีอากาศ แหล่งจุดติด การกระจายตัวและการกักล้อม อาจเกิดการระเบิดฝุ่นได้ ต้องควบคุมตามการประเมินอันตรายของระบบ.", "page": "9 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 93, "set": 2, "topic": 4, "q": "การทำให้ฝุ่นสะสมฟุ้งด้วยลมอัดโดยไม่ควบคุม อาจเพิ่มองค์ประกอบใดของ dust explosion?", "options": ["Dispersion หรือการกระจายตัวเป็นเมฆฝุ่น", "ทำให้ฝุ่นกลายเป็นสารไม่ติดไฟ", "กำจัดออกซิเจนทั้งหมด", "ลดเชื้อเพลิงเป็นศูนย์เสมอ"], "answer": 0, "explain": "ฝุ่นที่เดิมกองอยู่สามารถกระจายในอากาศได้ จึงเพิ่มความเสี่ยงเมื่อมีเงื่อนไขอื่นร่วม วิธีทำความสะอาดต้องเหมาะกับฝุ่นและการประเมินพื้นที่.", "page": "9 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 94, "set": 2, "topic": 4, "q": "เพื่อนบอกว่า “ไม่มีกลิ่นแล้ว แปลว่าไม่มีสารอันตราย” ควรตอบอย่างไร?", "options": ["ถูกต้องถ้ามองไม่เห็นก๊าซ", "ใช้กลิ่นแทนเครื่องตรวจวัดได้เสมอ", "กลิ่นไม่ใช่หลักฐานยืนยันความปลอดภัย ต้องใช้ข้อมูลและการตรวจวัดที่เหมาะสม", "ถูกต้องสำหรับสารเคมีทุกชนิด"], "answer": 2, "explain": "ความสามารถในการได้กลิ่นและความเข้มข้นที่เกิดอันตรายแตกต่างกัน การประเมินการรับสัมผัสไม่ควรใช้ความรู้สึกอย่างเดียว.", "page": "8–9 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 95, "set": 2, "topic": 4, "q": "การใส่ถุงมือทั่วไปแล้วจับสารกัดกร่อน ถือว่าประเมินครบหรือยัง?", "options": ["ไม่ต้องใช้ข้อมูลสารเมื่อสวม PPE", "ครบ เพราะถุงมือทุกชนิดเหมือนกัน", "ครบ หากถุงมือมีสีเข้ม", "ยัง ต้องตรวจความทนสารของวัสดุถุงมือและการป้องกันส่วนอื่นตามงาน"], "answer": 3, "explain": "การซึมผ่านและการเสื่อมของวัสดุขึ้นกับสารและสภาวะงาน งานที่มีการกระเด็นยังต้องพิจารณาตา ใบหน้าและร่างกายด้วย.", "page": "9 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 96, "set": 2, "topic": 4, "q": "เหตุใดการควบคุมสารพิษจึงไม่ควรพิจารณาเฉพาะการสูดดม?", "options": ["เพราะสารพิษไม่เข้าสู่ปอด", "บางสารเข้าสู่ร่างกายทางผิวหนัง การกิน หรือการฉีด/แทงได้", "เพราะสารทุกชนิดมีเส้นทางเดียว", "เพราะถุงมือแทนการระบายอากาศได้ทุกกรณี"], "answer": 1, "explain": "ต้องวิเคราะห์งานและพฤติกรรมสัมผัสร่วมกับคุณสมบัติสาร เพื่อเลือกมาตรการที่ครอบคลุมเส้นทางรับสัมผัสจริง.", "page": "9 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 97, "set": 2, "topic": 4, "q": "สารเดียวกันมีทั้งสัญลักษณ์กัดกร่อนและก๊าซภายใต้ความดัน ควรทำอย่างไร?", "options": ["พิจารณาอันตรายทั้งสองด้านร่วมกับ SDS", "เลือกเชื่อสัญลักษณ์ที่ใหญ่ที่สุดเพียงอันเดียว", "สรุปว่าเป็นฉลากผิดเสมอ", "ตัดอันตรายความดันทิ้งเพราะกัดกร่อนแล้ว"], "answer": 0, "explain": "สารหนึ่งมีอันตรายได้หลายประเภท การประเมินต้องรวมคุณสมบัติสาร สภาพบรรจุและลักษณะงาน ไม่เลือกเพียงอันตรายเดียว.", "page": "9 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 98, "set": 2, "topic": 4, "q": "การเพิ่มอุณหภูมิของสาร reactive โดยไม่ตรวจข้อจำกัด อาจนำไปสู่อะไร?", "options": ["ทำให้ไม่มีอันตรายหากภาชนะปิด", "ปฏิกิริยาหรือการสลายตัวเร็วขึ้น และอาจปล่อยความร้อน/ก๊าซ", "ลดปฏิกิริยาทุกชนิดเสมอ", "เปลี่ยนสารทุกชนิดเป็น NaCl"], "answer": 1, "explain": "สารไม่เสถียรอาจไวต่ออุณหภูมิ สภาวะที่เปลี่ยนจึงต้องตรวจข้อจำกัดจากข้อมูลสารและกระบวนการ ไม่ถือว่าภาชนะปิดเป็นหลักประกันความปลอดภัย.", "page": "9 • ประยุกต์", "kind": "วิเคราะห์"}, {"id": 99, "set": 2, "topic": 4, "q": "งานที่เสี่ยงสารกระเด็น เลือกใส่ PPE อย่างเดียวโดยไม่แก้ระบบรั่วเพียงพอหรือไม่?", "options": ["พอ เพราะ PPE ทำให้ hazard หายไป", "พอ ถ้าสารไม่มีสี", "ไม่ ควรควบคุมที่แหล่งกำเนิดและระบบงานร่วมกับ PPE ที่เหมาะสม", "พอ หากทำงานเร็วขึ้น"], "answer": 2, "explain": "PPE ช่วยลดการรับสัมผัสแต่ไม่ได้กำจัดการรั่วหรือคุณสมบัติอันตราย การควบคุมทางวิศวกรรมและวิธีปฏิบัติงานจึงยังมีบทบาท.", "page": "9 • ประยุกต์", "kind": "วิเคราะห์"}];

function selectSet(n){set=n;renderHome();}function selectMode(m){mode=m;renderHome();}
function status(t){const r=saved[key(t)];if(!r||!Array.isArray(r.ids))return 'ยังไม่ได้เริ่ม';if(r.done)return `ล่าสุด ${score(r)}/${r.ids.length} คะแนน`;return `ทำแล้ว ${Object.keys(r.answers||{}).length}/${r.ids.length} ข้อ`;}
function renderHome(){el.innerHTML=`<section class="hero"><span class="pill">YOUR PINK STUDY CORNER</span><h1>ฝึกจำให้แม่น<br>เข้าใจให้ถึงกระบวนการ<span style="color:var(--pink)">.</span></h1><p>ควิซเตรียมสอบ CIP3 จากสรุปของคุณ<br>เริ่มจากหลักการ แล้วลองคิดแบบวิศวกรผ่านโจทย์ประยุกต์</p><div class="stats"><div><strong>02</strong><span>ชุดฝึกคนละแนว</span></div><div><strong>05</strong><span>เรื่องสำคัญ</span></div><div><strong>100</strong><span>ข้อพร้อมคำอธิบาย</span></div></div><div class="decoration" aria-hidden="true">✿</div></section><h2>01 &nbsp; เลือกชุดที่อยากฝึก</h2><div class="sets"><button class="set ${set===1?'selected':''}" aria-pressed="${set===1}" onclick="selectSet(1)"><span class="tiny">SET 01 • FOUNDATION</span><strong>จำให้แม่น ✧</strong><p>พื้นฐาน ลำดับกระบวนการ และสูตรสำคัญ<br>50 ข้อ · เรื่องละ 10 ข้อ</p></button><button class="set ${set===2?'selected':''}" aria-pressed="${set===2}" onclick="selectSet(2)"><span class="tiny">SET 02 • APPLICATION</span><strong>คิดให้เป็น ♡</strong><p>สถานการณ์ วิเคราะห์ และคำนวณต่อยอด<br>50 ข้อ · เรื่องละ 10 ข้อ</p></button></div><div class="row"><h2 style="margin:12px 0">02 &nbsp; เลือกวิธีฝึก</h2><div class="modes"><button class="${mode==='practice'?'active':''}" aria-pressed="${mode==='practice'}" onclick="selectMode('practice')">ฝึกพร้อมเฉลย</button><button class="${mode==='exam'?'active':''}" aria-pressed="${mode==='exam'}" onclick="selectMode('exam')">จำลองสอบ</button></div></div><p class="help">${mode==='practice'?'เลือกคำตอบแล้วกดตรวจ • คิดให้ครบก่อนอ่านเหตุผล • เมื่อตรวจแล้วคำตอบจะถูกล็อก':'เลือกและแก้คำตอบได้ • ไม่แสดงเฉลยจนกดส่ง • ไม่มีเวลาบังคับ สามารถข้ามข้อและย้อนกลับได้'}</p><div class="banner row"><div><strong>ลองทำครบทั้งชุด ${set}</strong><div class="help">50 ข้อ ครบ 5 เรื่อง · ${status(-1)}</div></div><button class="primary" onclick="start(-1)">เริ่ม / ทำต่อทั้งชุด →</button></div><h2>03 &nbsp; หรือโฟกัสทีละเรื่อง</h2><div class="topics">${TOPICS.map((t,i)=>`<article class="topic"><div class="topichead"><span class="icon" aria-hidden="true">${t.icon}</span><div><div class="tiny">${t.en}</div><h3>${t.name}</h3></div></div><p>${t.desc}</p><div class="row"><span>10 ข้อ · ${status(i)}</span><button onclick="start(${i})">เริ่ม / ทำต่อ →</button></div></article>`).join('')}</div><p class="help" style="margin-top:26px">แนะนำ: ชุด 1 โหมดฝึก → อ่านเหตุผลของข้อที่พลาด → ชุด 2 โหมดสอบ → ฝึกซ้ำเฉพาะข้อผิด<br>บันทึกอัตโนมัติในเบราว์เซอร์นี้เมื่อรองรับ localStorage คะแนนแต่ละเรื่องและคะแนนรวมเก็บแยกกัน</p><details class="note"><summary>ที่มาและขอบเขตของควิซ</summary><p>ใช้ไฟล์ สรุปcip3.pdf เป็นแกน: เกลือ หน้า 2–3, กระดาษ หน้า 4–6, พลังงาน หน้า 7, สิ่งแวดล้อม หน้า 8, ความปลอดภัย หน้า 9 โดยนับหน้าปกเป็นหน้า 1 โจทย์ประยุกต์และข้อแก้ความคลาดเคลื่อนระบุไว้ในเฉลย เป็นแบบฝึกเตรียมสอบ ไม่ใช่ข้อสอบจริงหรือขั้นตอนปฏิบัติงานโรงงาน</p><p>มีการทวนจุดสำคัญกับ <a href="https://eurochlor.org/contact-us/faq/" target="_blank" rel="noopener">Euro Chlor</a>, <a href="https://www.iso.org/standard/69426.html" target="_blank" rel="noopener">ISO 50001</a>, <a href="https://www.iso.org/standard/14001" target="_blank" rel="noopener">ISO 14001</a> และ <a href="https://www.osha.gov/publications/3371combustible-dust" target="_blank" rel="noopener">OSHA: ฝุ่นติดไฟ</a> ลิงก์แหล่งข้อมูลต้องใช้อินเทอร์เน็ต แต่ควิซใช้งานออฟไลน์ได้</p></details>`;}
function makeRun(topic,ids,temporary=false){return {topic,set,mode,ids:ids||DATA.filter(q=>q.set===set&&(topic===-1||q.topic===topic)).map(q=>q.id),answers:{},locked:{},index:0,done:false,temporary};}
function valid(r){return r&&Array.isArray(r.ids)&&r.ids.length>0&&r.ids.every(id=>Number.isInteger(id)&&DATA[id])&&r.answers&&r.locked&&Number.isInteger(r.index)&&r.index>=0&&r.index<r.ids.length;}
function start(topic){const prev=saved[key(topic)];run=valid(prev)?prev:makeRun(topic);persist();if(run.done)results();else question();jump();}
function persist(){if(!run.temporary){saved[`${run.set}-${run.topic}-${run.mode}`]=run;save();}}
function score(r){return r.ids.filter(id=>r.answers[id]===DATA[id].answer).length;}
function question(){screen='quiz';topnav('navhome');const q=DATA[run.ids[run.index]],a=run.answers[q.id],locked=!!run.locked[q.id],n=Object.keys(run.answers).length;el.innerHTML=`<div class="row"><button class="ghost" onclick="home()">← เลือกเรื่อง</button><span class="pill">ชุด ${run.set} · ${run.temporary?'ทวนข้อผิด':run.mode==='practice'?'โหมดฝึก':'จำลองสอบ'}</span></div><h2>${esc(label(run.topic))}</h2><div class="row help"><span>ข้อ ${run.index+1} จาก ${run.ids.length} · ${TOPICS[q.topic].name}</span><span>ตอบแล้ว ${n}/${run.ids.length}</span></div><div class="progress" role="progressbar" aria-label="ความคืบหน้าการตอบ" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${run.ids.length}"><div style="width:${n/run.ids.length*100}%"></div></div><section class="card"><div class="row"><span class="tiny">QUESTION ${String(run.index+1).padStart(2,'0')}</span><span class="pill">${q.kind}</span></div><h1 class="qtitle" id="questionTitle" tabindex="-1">${esc(q.q)}</h1><div class="choices" role="group" aria-labelledby="questionTitle">${q.options.map((o,i)=>`<button class="choice ${a===i?'selected':''} ${locked&&i===q.answer?'correct':''} ${locked&&a===i&&i!==q.answer?'wrong':''}" ${locked?'disabled':''} aria-pressed="${a===i}" onclick="choose(${i})"><span class="letter">${'กขคง'[i]}</span><span>${esc(o)}${locked&&i===q.answer?' ✓':''}${locked&&a===i&&i!==q.answer?' ✕':''}</span></button>`).join('')}</div>${locked?`<div class="feedback ${a!==q.answer?'bad':''}" role="status"><strong>${a===q.answer?'✓ ถูกต้อง เก่งมาก!':'✧ ยังไม่ถูก ลองจำเหตุผลนี้นะ'}</strong><p>${esc(q.explain)}</p><div class="ref">อิงสรุป หน้า ${esc(q.page)}</div></div>`:''}<div class="actions"><button onclick="move(-1)" ${run.index===0?'disabled':''}>← ข้อก่อนหน้า</button><div class="row">${run.mode==='practice'&&!locked?`<button class="primary" onclick="check()" ${a===undefined?'disabled':''}>ตรวจคำตอบ</button>`:''}${run.index<run.ids.length-1?'<button onclick="move(1)">ข้อถัดไป →</button>':'<button onclick="finish()" class="primary">ส่งคำตอบ / ดูผล</button>'}</div></div></section><section class="card"><div class="row"><strong>แผนที่คำถาม</strong><button class="ghost" onclick="finish()">ส่งคำตอบ</button></div><p class="help">พื้นชมพู = เลือกคำตอบแล้ว · กรอบเข้ม = ข้อปัจจุบัน${run.mode==='practice'?' · ก่อนส่งสามารถกลับไปตรวจข้อที่ยังไม่ตรวจได้':''}</p><div class="qnav">${run.ids.map((id,i)=>`<button class="${run.answers[id]!==undefined?'answered':''} ${run.index===i?'current':''}" aria-label="ไปข้อ ${i+1}${run.answers[id]!==undefined?' ตอบแล้ว':''}" ${run.index===i?'aria-current="step"':''} onclick="gotoQuestion(${i})">${i+1}</button>`).join('')}</div></section>`;}
function choose(i){const id=run.ids[run.index];if(run.locked[id]||!Number.isInteger(i)||i<0||i>3)return;run.answers[id]=i;persist();question();}
function check(){const id=run.ids[run.index];if(run.answers[id]===undefined)return;run.locked[id]=true;persist();question();}
function gotoQuestion(i){run.index=i;persist();question();document.getElementById('questionTitle').focus({preventScroll:true});jump();}function move(d){gotoQuestion(run.index+d);}
function confirmAction(title,text,fn,accept='ยืนยัน'){const d=document.getElementById('confirmDialog');document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogText').textContent=text;document.getElementById('acceptDialog').textContent=accept;document.getElementById('acceptDialog').onclick=()=>{d.close();fn();};document.getElementById('cancelDialog').onclick=()=>d.close();d.showModal();}
function finish(){const left=run.ids.filter(id=>run.answers[id]===undefined).length;confirmAction('ส่งคำตอบรอบนี้?',left?`ยังไม่ได้ตอบ ${left} ข้อ ข้อที่เว้นจะนับเป็น 0 คะแนน เมื่อส่งแล้วจะเปิดเฉลยทั้งหมด`:'เมื่อตรวจคะแนนแล้ว คำตอบรอบนี้จะถูกล็อก และเปิดเฉลยพร้อมคำอธิบายทุกข้อ',()=>{run.done=true;persist();results();jump();},'ส่งและดูคะแนน');}
function results(){screen='results';const s=score(run),total=run.ids.length,wrong=run.ids.filter(id=>run.answers[id]!==DATA[id].answer);el.innerHTML=`<div class="row"><button class="ghost" onclick="home()">← กลับห้องฝึก</button><span class="pill">ชุด ${run.set} · ${run.temporary?'ทวนข้อผิด':run.mode==='exam'?'จำลองสอบ':'ฝึกพร้อมเฉลย'}</span></div><section class="card" style="margin-top:24px;text-align:center"><div class="tiny">ONE STEP CLOSER ✿</div><h2 style="margin:14px 0">${s===total?'เข้าใจครบแล้วในรอบนี้!':s/total>=.8?'พื้นฐานแน่นขึ้นแล้วนะ':'เจอจุดที่ควรทวนแล้ว ค่อย ๆ ไปต่อ'}</h2><div class="score">${s}<span style="font-size:28px;color:var(--muted)"> / ${total}</span></div><p>${Math.round(s/total*100)}% · ${label(run.topic)} · ข้อละ 1 คะแนน</p><p class="help">ตอบถูก ${s} · ตอบผิด ${total-s-run.ids.filter(id=>run.answers[id]===undefined).length} · เว้น ${run.ids.filter(id=>run.answers[id]===undefined).length}<br>คะแนนใช้ติดตามการฝึก ไม่ใช่เกณฑ์ผ่านข้อสอบจริง</p><div class="row" style="justify-content:center"><button class="primary" onclick="retryWrong()" ${wrong.length?'':'disabled'}>ทวนข้อผิด / เว้น ${wrong.length} ข้อ</button><button onclick="restart()">เริ่มรอบใหม่</button></div></section><section class="card"><h3>แผนทบทวนรายเรื่อง</h3><table class="table"><thead><tr><th>เรื่อง</th><th>คะแนน</th><th>ทบทวนต่อ</th></tr></thead><tbody>${TOPICS.map((t,i)=>{const ids=run.ids.filter(id=>DATA[id].topic===i);if(!ids.length)return '';const good=ids.filter(id=>run.answers[id]===DATA[id].answer).length;return `<tr><td>${t.name}</td><td>${good}/${ids.length}</td><td>${good===ids.length?'ลองอธิบายหลักการด้วยตัวเอง':`ทวน ${ids.length-good} ข้อ แล้วลองทำใหม่`}</td></tr>`;}).join('')}</tbody></table></section><div class="row"><h2>ทบทวนเฉลยและวิธีคิด</h2><label class="help">แสดง <select id="reviewFilter" onchange="renderReview(this.value)"><option value="all">ทุกข้อ</option><option value="wrong">เฉพาะผิด / เว้น</option></select></label></div><div id="reviewList"></div>`;renderReview('all');}
function renderReview(filter){document.getElementById('reviewList').innerHTML=run.ids.map((id,i)=>{const q=DATA[id],a=run.answers[id],ok=a===q.answer;if(filter==='wrong'&&ok)return '';return `<details class="review"><summary>${ok?'✓':'✧'} ข้อ ${i+1} · ${esc(q.q)}</summary><div class="inside"><p><b>คำตอบของคุณ:</b> ${a===undefined?'เว้นไว้':esc(q.options[a])}<br><b>คำตอบที่ถูก:</b> ${esc(q.options[q.answer])}</p><div class="feedback ${ok?'':'bad'}">${esc(q.explain)}<div class="ref">${TOPICS[q.topic].name} · อิงสรุป หน้า ${esc(q.page)}</div></div></div></details>`;}).join('')||'<p class="help">ไม่มีข้อผิดหรือข้อเว้นในรอบนี้ ♡</p>';}
function retryWrong(){const ids=run.ids.filter(id=>run.answers[id]!==DATA[id].answer);if(!ids.length)return;set=run.set;mode='practice';run=makeRun(run.topic,ids,true);question();jump();}
function restart(){confirmAction('เริ่มรอบใหม่?', 'คำตอบรอบนี้จะถูกแทนที่ด้วยรอบใหม่ หากต้องการเก็บคะแนนเดิมให้กลับไปเลือกชุดหรือเรื่องอื่น',()=>{set=run.set;mode=run.mode;run=makeRun(run.topic,run.temporary?run.ids:undefined,run.temporary);persist();question();jump();},'เริ่มรอบใหม่');}
function notes(){screen='notes';topnav('navnotes');el.innerHTML=`<span class="pill">REVISION NOTES</span><h1>สูตรสั้น ๆ และจุดที่ควรจำให้ถูก ✧</h1><p class="help">ทวนหลังทำควิซ แล้วปิดสูตรลองอธิบายด้วยตัวเองอีกครั้ง ถ้ากำลังทำควิซ ความคืบหน้าที่บันทึกไว้ยังอยู่</p><section class="card note"><h3>01 / เกลือและ Electrolysis</h3><div class="formula">Q = It<br>n(Cl₂) = ηᵢIt / (2F)<br>V(Cl₂) = nVₘ</div><p>I หน่วย A, t หน่วย s, F = 96,500 C/mol e⁻ ตามโจทย์, ηᵢ เป็นประสิทธิภาพกระแสแบบเศษส่วน และ Vₘ = 24 L/mol เฉพาะโจทย์ที่กำหนด ไม่ใช่ค่าปริมาตรโมลที่ใช้ได้ทุกอุณหภูมิและความดัน</p><p>สมการรวม: 2NaCl + 2H₂O → 2NaOH + H₂ + Cl₂<br>Ca²⁺ + CO₃²⁻ → CaCO₃↓<br>Mg²⁺ + 2OH⁻ → Mg(OH)₂↓</p><p><b>จุดแก้ความเข้าใจ:</b> Na₂CO₃ ไม่ใช่ผลผลิตโดยตรงของ chlor-alkali และความลึก solution mining ขึ้นกับแหล่งแร่ ไม่ใช้ตัวเลขตัวอย่างเป็นค่าตายตัว</p></section><section class="card note"><h3>02 / กระดาษและสมดุลมวล</h3><div class="formula">มวล (g) = GSM (g/m²) × พื้นที่ (m²)<br>v (m/min) = มวลผลิต (g/day) / [GSM × กว้าง (m) × เวลาเดิน (min/day)]<br>มวลรวม = มวลของแข็งแห้ง / สัดส่วน dry content<br>มวลน้ำ = มวลรวม − มวลของแข็งแห้ง</div><p>โจทย์ความเร็วสมมติความกว้างและ GSM สม่ำเสมอ ไม่มีของเสีย และเดินครบเวลาที่กำหนด ของแข็งแห้งต้องอนุรักษ์ในโจทย์การแยกน้ำ</p><p><b>จุดแก้ความเข้าใจ:</b> GSM คือมวลต่อพื้นที่ ไม่ใช่ความหนาโดยตรง การทำเยื่อเชิงกลมุ่งแยกเส้นใยและยังคง lignin มาก จึงไม่ควรจำว่าทุก pulping ต้องกำจัด lignin หมด</p><p>Headbox → Wire → Press → Dryer → Calender → Reel → Winder<br>รีดน้ำก่อนอบช่วยลดภาระการระเหย ส่วน calender ปรับผิวและความหนา</p></section><section class="card note"><h3>03 / พลังงาน</h3><div class="formula">Q̇useful = ṁCp(Tout − Tin)<br>Q̇input = Q̇useful / η<br>1 kWh = 3,600 kJ · 1 GJ = 1,000,000 kJ<br>พลังงาน (kWh) = กำลัง (kW) × เวลา (h)<br>พลังงานใหม่ = พลังงานเดิม × (1 − สัดส่วนที่ลด)</div><p>Q̇ เป็นอัตราพลังงาน ถ้า ṁ เป็น kg/h และ Cp เป็น kJ/(kg·°C) จะได้ kJ/h; หาร 3,600 เป็น kW ส่วน kWh คือพลังงาน ไม่ใช่กำลัง</p><p><b>จุดที่โจทย์ต้องชัด:</b> การลด input 20% ที่ useful heat เท่าเดิม จากประสิทธิภาพ 80% ต้องไปถึง 100% ในสมดุลอุดมคติ ไม่ใช่เพียงคูณตัวเลขแล้วสรุปว่าทำได้จริงง่าย ๆ</p><p>SEU = จุดใช้พลังงานที่มีนัยสำคัญ · EnB = ฐานอ้างอิง · EnPI = ตัวชี้วัดสมรรถนะ<br>PDCA = Plan → Do → Check → Act</p></section><section class="card note"><h3>04 / สิ่งแวดล้อมและความปลอดภัย</h3><p>8 กลุ่มในสรุป: Air emissions, VOCs/Fugitive emissions, Wastewater, Hazardous waste, Solid waste, Odor, Noise และ Thermal pollution</p><p>Dust explosion pentagon: ฝุ่นติดไฟ + ออกซิเจน + แหล่งจุดติด + การฟุ้งกระจาย + การกักล้อม<br>คำว่า confinement ในบริบทนี้ไม่จำเป็นต้องเป็นพื้นที่อับอากาศตามนิยามกฎหมาย</p><p><b>จำอย่างมีเงื่อนไข:</b> ชื่อของเสียหรือความใสของน้ำไม่เพียงพอต่อการประเมินอันตราย กลิ่นไม่ยืนยันความปลอดภัย และ PPE ต้องเลือกตามสาร/งานจริงร่วมกับการควบคุมอื่น ใช้ SDS และข้อกำหนดของสถานประกอบการสำหรับการปฏิบัติงานจริง</p><p>ควิซทบทวนหลักการ ISO 14001 และ ISO 50001 ตามเนื้อหา ไม่ได้ใช้เป็นรายการตรวจรับรองมาตรฐานหรือเกณฑ์กฎหมายฉบับใด</p></section><section class="card note"><h3>แหล่งเนื้อหา</h3><p>สรุปcip3.pdf: หน้า 2–3 เกลือ, 4–6 เยื่อและกระดาษ, 7 พลังงาน, 8 สิ่งแวดล้อม, 9 ความปลอดภัย ตัวเลขที่อ่านข้อความไม่ชัดตรวจเทียบกับภาพหน้าเอกสารแล้ว เฉลยคำนวณใหม่ตามข้อมูลโจทย์</p><p>อ่านเสริม: <a href="https://eurochlor.org/contact-us/faq/" target="_blank" rel="noopener">Euro Chlor — ผลิตภัณฑ์ chlor-alkali</a> · <a href="https://www.iso.org/standard/69426.html" target="_blank" rel="noopener">ISO — Energy management</a> · <a href="https://www.iso.org/standard/14001" target="_blank" rel="noopener">ISO — Environmental management</a> · <a href="https://www.osha.gov/publications/3371combustible-dust" target="_blank" rel="noopener">OSHA — Combustible dust</a> · <a href="https://www.osha.gov/sites/default/files/2021-03/Chemical%20Hazards.pdf" target="_blank" rel="noopener">OSHA — Chemical hazards & SDS</a></p></section><button class="primary" onclick="home()">กลับไปฝึกกัน →</button>`;jump();}
